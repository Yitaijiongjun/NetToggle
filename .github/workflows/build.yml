name: Build NetToggle

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Validate Shizuku-only App Surface
        run: python3 scripts/check_surface.py

      - name: Test and Build Release
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest assembleRelease

      - name: Sign and Verify Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | sed '/---/d' | tr -d '\r\n ' | base64 --decode > release.keystore
          test -s release.keystore
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK_DIR=app/build/outputs/apk/release
          "$BUILD_TOOLS_DIR/zipalign" -p 4 "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/app-release-aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$APK_DIR/NetToggle.apk" "$APK_DIR/app-release-aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_DIR/NetToggle.apk"
          sha256sum "$APK_DIR/NetToggle.apk"

      - name: Upload Signed Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: NetToggle
          path: app/build/outputs/apk/release/NetToggle.apk
          compression-level: 0
          if-no-files-found: error

      - name: Remove Decoded Keystore
        if: always()
        run: rm -f release.keystore
